name: verify

on:
  push:
    branches:
      - develop
      - main
      - "codex/**"
      - "agent/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Typecheck
        run: npm run typecheck

      - name: Biome check
        run: npm run check

      - name: Repository lint
        run: npm run lint:repo

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Storybook build
        run: npm run build-storybook

      - name: Storybook browser and a11y tests
        run: npm run test:storybook

      - name: Training route smoke
        run: npm run verify:smoke
